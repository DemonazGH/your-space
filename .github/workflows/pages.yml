name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: mkdir -p public/plans
      - run: cp index.html app.js cloud.js questions.js style.css public/
      - run: cp plans/index.html plans/app.js plans/style.css public/plans/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Compass after successful publication
        env:
          TELEGRAM_NOTIFY_KEY: ${{ secrets.TELEGRAM_NOTIFY_KEY }}
        run: node scripts/notify-block.mjs
